<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earrings Collection - Goda Gold Jewellery FZCO</title>
    <link rel="icon" type="image/x-icon" href="godaa.ico">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for Brand Styling -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Playfair Display', serif;
        }
        .img-card {
            transition: all 0.4s ease-in-out;
        }
        .img-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 25px rgba(217, 119, 6, 0.25);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            
            <!-- Brand Logo -->
            <a href="index.html" class="flex flex-col items-start leading-tight">
                <span class="text-xl md:text-2xl font-bold tracking-[0.2em]">GODA</span>
                <div class="flex items-center w-full my-0.5">
                    <div class="flex-grow border-t border-amber-400/60"></div>
                    <span class="px-2 text-[10px] md:text-xs tracking-[0.25em] text-amber-300 font-semibold">GOLD</span>
                    <div class="flex-grow border-t border-amber-400/60"></div>
                </div>
                <span class="text-[9px] md:text-[10px] tracking-[0.15em] text-slate-300 uppercase">JEWELLERY FZCO</span>
            </a>

            <!-- Navigation Links -->
            <nav class="flex items-center space-x-6 md:space-x-8 text-sm md:text-base font-medium">
                <a href="index.html" class="hover:text-amber-400 transition">Home</a>
                <a href="About Us.html" class="hover:text-amber-400 transition">About Us</a>
                
                <!-- Collections Dropdown with Mobile Tap & Desktop Hover Support -->
                <div class="relative py-2" id="dropdown-container">
                    <button id="dropdown-btn" class="flex items-center space-x-1 hover:text-amber-400 transition font-medium focus:outline-none cursor-pointer">
                        <span>Collections</span>
                        <i id="dropdown-icon" class="fa-solid fa-chevron-down text-xs transition-transform duration-300"></i>
                    </button>
                    <!-- Dropdown Menu -->
                    <div id="dropdown-menu" class="absolute right-0 pt-2 w-48 hidden transition-all z-50">
                        <div class="bg-slate-900 border border-slate-800 rounded-xl shadow-xl py-2">
                            <a href="bangles.html" class="block px-4 py-2 text-sm text-slate-300 hover:bg-slate-800 hover:text-amber-400 transition">Bangles</a>
                            <a href="earrings.html" class="block px-4 py-2 text-sm text-amber-400 bg-slate-800/50 font-semibold">Earrings</a>
                            <a href="necklaces.html" class="block px-4 py-2 text-sm text-slate-300 hover:bg-slate-800 hover:text-amber-400 transition">Necklaces</a>
                            <a href="rings.html" class="block px-4 py-2 text-sm text-slate-300 hover:bg-slate-800 hover:text-amber-400 transition">Rings</a>
                        </div>
                    </div>
                </div>

                <a href="contact.html" class="hover:text-amber-400 transition">Contact Us</a>
            </nav>
        </div>
    </header>

    <!-- Page Banner -->
    <section class="bg-white text-gray-900 py-12 text-center border-b border-gray-200">
        <div class="max-w-4xl mx-auto px-6">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900">Exquisite Earrings Collection</h1>
            <p class="mt-2 text-gray-600 text-sm md:text-base">
                Mastercrafted gold earrings engineered with precision, high purity, and timeless elegance.
            </p>
        </div>
    </section>

    <!-- Gallery Grid Section -->
    <main class="max-w-7xl mx-auto px-6 py-12">
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="gallery-grid">
            <!-- Images will be injected dynamically via script -->
        </div>
    </main>

    <!-- Lightbox Modal for Slider View -->
    <div id="lightbox" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4">
        <!-- Close Button -->
        <button onclick="closeLightbox()" class="absolute top-6 right-6 text-white text-3xl hover:text-amber-400 focus:outline-none z-50 cursor-pointer">
            <i class="fa-solid fa-xmark"></i>
        </button>
        
        <!-- Previous Button -->
        <button onclick="changeSlide(-1)" class="absolute left-4 md:left-10 text-white bg-slate-800/60 hover:bg-amber-600 p-3 md:p-4 rounded-full text-xl transition focus:outline-none cursor-pointer">
            <i class="fa-solid fa-chevron-left"></i>
        </button>

        <!-- Current Image Display -->
        <div class="max-w-4xl max-h-[85vh] flex items-center justify-center p-2">
            <img id="lightbox-img" src="" alt="Earring Zoomed View" class="max-h-[80vh] max-w-full object-contain rounded-lg shadow-2xl border border-slate-700">
        </div>

        <!-- Next Button -->
        <button onclick="changeSlide(1)" class="absolute right-4 md:right-10 text-white bg-slate-800/60 hover:bg-amber-600 p-3 md:p-4 rounded-full text-xl transition focus:outline-none cursor-pointer">
            <i class="fa-solid fa-chevron-right"></i>
        </button>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-900 text-white text-center py-6 text-sm border-t border-slate-800 mt-12">
        <p>&copy; 2026 Goda Gold Jewellery FZCO. All rights reserved.</p>
    </footer>

    <!-- JavaScript for Dynamic Gallery & Lightbox Slider -->
    <script>
        const images = [
            "https://res.cloudinary.com/gz546ufv/image/upload/v1784984378/1_dvgtft.png",
            "https://res.cloudinary.com/gz546ufv/image/upload/v1784984379/2_qihdr3.png",
            "https://res.cloudinary.com/gz546ufv/image/upload/v1784984380/3_cmvphw.png",
            "https://res.cloudinary.com/gz546ufv/image/upload/v1784984381/4_i8cymh.png",
            "https://res.cloudinary.com/gz546ufv/image/upload/v1784984381/5_elgd38.png",
            "https://res.cloudinary.com/gz546ufv/image/upload/v1784984382/6_hdwi82.png",
            "https://res.cloudinary.com/gz546ufv/image/upload/v1784984383/7_fwaiso.png",
            "https://res.cloudinary.com/gz546ufv/image/upload/v1784984384/8_lfcq26.png",
            "https://res.cloudinary.com/gz546ufv/image/upload/v1784984385/9_x5l9gy.png",
            "https://res.cloudinary.com/gz546ufv/image/upload/v1784984386/10_gtdkdy.png"
        ];

        let currentIndex = 0;
        const gridContainer = document.getElementById('gallery-grid');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        // Populate Gallery Grid
        images.forEach((url, index) => {
            const card = document.createElement('div');
            card.className = "bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-sm img-card cursor-pointer flex flex-col items-center p-3";
            card.onclick = () => openLightbox(index);

            card.innerHTML = `
                <div class="w-full h-64 overflow-hidden rounded-xl bg-gray-50 flex items-center justify-center">
                    <img src="${url}" alt="Earring Design ${index + 1}" class="w-full h-full object-cover transition duration-500 hover:scale-105">
                </div>
                <div class="mt-3 text-center">
                    <p class="text-xs font-semibold text-amber-700 tracking-wider uppercase">Goda Masterpiece</p>
                    <p class="text-sm font-bold text-gray-800 mt-0.5">Earring Design #${index + 1}</p>
                </div>
            `;
            gridContainer.appendChild(card);
        });

        function openLightbox(index) {
            currentIndex = index;
            lightboxImg.src = images[currentIndex];
            lightbox.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function changeSlide(direction) {
            currentIndex += direction;
            if (currentIndex < 0) {
                currentIndex = images.length - 1;
            } else if (currentIndex >= images.length) {
                currentIndex = 0;
            }
            lightboxImg.src = images[currentIndex];
        }

        // Close on background click or Escape key
        lightbox.onclick = (e) => {
            if (e.target === lightbox) {
                closeLightbox();
            }
        };

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('hidden')) {
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowLeft') changeSlide(-1);
                if (e.key === 'ArrowRight') changeSlide(1);
            }
        });

        // Dropdown Toggle Logic for Mobile & Desktop
        const dropdownContainer = document.getElementById('dropdown-container');
        const dropdownBtn = document.getElementById('dropdown-btn');
        const dropdownMenu = document.getElementById('dropdown-menu');
        const dropdownIcon = document.getElementById('dropdown-icon');

        dropdownBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = !dropdownMenu.classList.contains('hidden');
            if (isOpen) {
                dropdownMenu.classList.add('hidden');
                dropdownIcon.classList.remove('rotate-180');
            } else {
                dropdownMenu.classList.remove('hidden');
                dropdownIcon.classList.add('rotate-180');
            }
        });

        dropdownContainer.addEventListener('mouseenter', () => {
            if (window.innerWidth >= 768) {
                dropdownMenu.classList.remove('hidden');
                dropdownIcon.classList.add('rotate-180');
            }
        });

        dropdownContainer.addEventListener('mouseleave', () => {
            if (window.innerWidth >= 768) {
                dropdownMenu.classList.add('hidden');
                dropdownIcon.classList.remove('rotate-180');
            }
        });

        window.addEventListener('click', () => {
            dropdownMenu.classList.add('hidden');
            dropdownIcon.classList.remove('rotate-180');
        });
    </script>

</body>
</html>
